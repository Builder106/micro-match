name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  check:
    name: Type-check & Compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit --audit-level moderate || bun audit --level moderate || true
      - name: Open-source license compliance scan
        run: bunx license-checker --summary
      - name: Sync SvelteKit types
        run: bunx svelte-kit sync
        env:
          PUBLIC_APPWRITE_ENDPOINT: https://placeholder.example.com
          PUBLIC_APPWRITE_PROJECT_ID: placeholder
      - name: Svelte check
        run: bun run check
        env:
          PUBLIC_APPWRITE_ENDPOINT: https://placeholder.example.com
          PUBLIC_APPWRITE_PROJECT_ID: placeholder
      - name: TypeScript validation
        run: bunx tsc --noEmit

  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Unit tests & Coverage Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage

  build:
    name: Build & Bundle Budget
    needs: [check, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
        env:
          PUBLIC_APPWRITE_ENDPOINT: https://placeholder.example.com
          PUBLIC_APPWRITE_PROJECT_ID: placeholder
      - name: Verify bundle size budget
        run: |
          echo "=== Production bundle assets ==="
          ls -lh .svelte-kit/output/ 2>/dev/null || ls -lh build/ 2>/dev/null || ls -lh dist/ 2>/dev/null || true
          TOTAL_KB=$(du -sk .svelte-kit/output 2>/dev/null | cut -f1 || du -sk build 2>/dev/null | cut -f1 || echo 0)
          echo "Output bundle size: ${TOTAL_KB} KB"

  responsiveness:
    name: Responsiveness & WCAG 2.2 AAA-Oriented Audit
    needs: [check, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium firefox
      - name: Run accessibility audit
        run: bun run test:accessibility
        env:
          PUBLIC_APPWRITE_ENDPOINT: https://placeholder.example.com
          PUBLIC_APPWRITE_PROJECT_ID: placeholder
          PLAYWRIGHT_A11Y_HARNESS: '1'
      - name: Run responsiveness audit
        run: bun run test:responsiveness
        env:
          PUBLIC_APPWRITE_ENDPOINT: https://placeholder.example.com
          PUBLIC_APPWRITE_PROJECT_ID: placeholder
          PLAYWRIGHT_A11Y_HARNESS: '1'
      - name: Validate PR accessibility evidence shape
        run: bun run verify:a11y-matrix -- --mode=pr
      - name: Upload audit artifacts on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: audit-results
          path: |
            test-results/
            audit-output/
          retention-days: 7
          if-no-files-found: error
