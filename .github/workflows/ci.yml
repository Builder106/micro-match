name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PUBLIC_APPWRITE_ENDPOINT: https://placeholder.example.com
  PUBLIC_APPWRITE_PROJECT_ID: placeholder

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Type-check & Compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level moderate || bun audit --level moderate || true
      - run: bunx license-checker --summary
      - run: bunx svelte-kit sync
      - run: bun run check
      - run: bun run typecheck
      - run: bun run check:tsgo

  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Unit tests & Coverage Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run paraglide:compile
      - run: bunx svelte-kit sync
      - run: bun run test:coverage

  build:
    name: Build & Bundle Budget
    needs: [check, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run paraglide:compile
      - run: bun run build
      - run: |
          ls -lh .svelte-kit/output/ 2>/dev/null || ls -lh build/ 2>/dev/null || true
          du -sk .svelte-kit/output 2>/dev/null || du -sk build 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: micro-match-build-${{ github.run_id }}
          path: |
            .svelte-kit/output/
            build/
          if-no-files-found: error
          retention-days: 1

  functional:
    name: Browser functional flows
    needs: [check, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run paraglide:compile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:functional
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: functional-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  responsiveness:
    name: Browser responsiveness
    needs: [check, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run paraglide:compile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:responsiveness
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: responsiveness-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  visual:
    name: Browser visual baselines
    needs: [check, lint]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run paraglide:compile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  vercel-function:
    name: Vercel function smoke
    needs: [check, lint]
    runs-on: ubuntu-24.04
    env:
      PUBLIC_APPWRITE_ENDPOINT: ''
      PUBLIC_APPWRITE_PROJECT_ID: ''
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run paraglide:compile
      - run: bun run build
      - run: bun run test:vercel

  ci-gate:
    name: CI required gate
    if: ${{ always() }}
    needs: [check, lint, test, build, functional, responsiveness, visual, vercel-function]
    runs-on: ubuntu-24.04
    steps:
      - name: Require selected CI checks
        env:
          CHECK: ${{ needs.check.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          FUNCTIONAL: ${{ needs.functional.result }}
          RESPONSIVENESS: ${{ needs.responsiveness.result }}
          VISUAL: ${{ needs.visual.result }}
          VERCEL_FUNCTION: ${{ needs.vercel-function.result }}
        run: |
          for result in "$CHECK" "$LINT" "$TEST" "$BUILD" "$FUNCTIONAL" "$RESPONSIVENESS" "$VISUAL" "$VERCEL_FUNCTION"; do
            if [ "$result" != success ]; then exit 1; fi
          done

  deploy:
    name: Trigger Vercel Deploy
    needs: [secrets, ci-gate]
    if: always() && !cancelled() && needs.secrets.result == 'success' && needs.ci-gate.result == 'success' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deploy hook trigger"
            exit 1
          fi
          curl -sS -f -X POST "$HOOK_URL"
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_PROD is not set; skipping deploy hook trigger"
            exit 1
          fi
          curl -sS -f -X POST "$HOOK_URL"
