<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>End card</title>
  </head>
  <body>
    <template>
      <style>
        /* The end card is the title block: a sawtooth border pieced around a signed center. */
        #root {
          position: absolute;
          inset: 0;
          background: #f3ead9;
        }
        .border {
          position: absolute;
          inset: 70px 210px;
          /* Half-square triangles in madder and indigo, the title block's sawtooth. */
          background: linear-gradient(135deg, #1c1f3b 50%, #ff6b6b 50%) 0 0 / 60px 60px;
          clip-path: inset(50%);
        }
        .center {
          position: absolute;
          inset: 130px 270px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 110px;
          background: #fdfcf8;
          opacity: 0;
        }
        .mark {
          width: 92px;
          height: 92px;
          margin-bottom: 34px;
        }
        h1 {
          margin: 0;
          font: 680 112px/0.95 "Bricolage", sans-serif;
          font-stretch: 96%;
          letter-spacing: -0.035em;
          color: #1c1f3b;
        }
        .note {
          margin: 34px 0 0;
          font: 400 40px/1.3 "Host", sans-serif;
          color: #575b76;
        }
        .url {
          margin: 30px 0 0;
          font: 700 44px/1 "Host", sans-serif;
          color: #1c1f3b;
          text-decoration: underline dashed 3px #ff6b6b;
          text-underline-offset: 10px;
        }
        h1, .note, .url, .mark {
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="end" data-width="1920" data-height="1080">
        <div class="border"></div>
        <div class="center">
          <img class="mark" src="public/mark.svg" alt="" />
          <h1>Small tasks, sewn into something warm.</h1>
          <p class="note">Free and non-commercial. A student project, starting at Wesleyan.</p>
          <p class="url">micromatch.app</p>
        </div>
      </div>

      <script>
        // Local time: 0 is 39.50 s in the trailer.
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const scope = document.querySelector('[data-composition-id="end"]');
        const $ = (s) => scope.querySelector(s);
        const up = { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" };
        tl.fromTo($(".border"), { clipPath: "inset(50%)" }, { clipPath: "inset(0%)", duration: 0.9, ease: "power3.inOut" }, 0)
          .to($(".center"), { opacity: 1, duration: 0.3, ease: "none" }, 0.55)
          .fromTo($(".mark"), { opacity: 0, y: 18, rotation: -10 }, { ...up, rotation: 0 }, 0.75)
          .fromTo($("h1"), { opacity: 0, y: 22 }, up, 0.95)
          .fromTo($(".note"), { opacity: 0, y: 18 }, up, 1.35)
          .fromTo($(".url"), { opacity: 0, y: 18 }, up, 1.6);
        window.__timelines["end"] = tl;
      </script>
    </template>
  </body>
</html>
