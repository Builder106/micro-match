<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MicroMatch trailer</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* The site's type: Bricolage for display, Host for body. */
      @font-face {
        font-family: "Bricolage";
        src: url("public/fonts/bricolage-200_800-normal.woff2") format("woff2");
        font-weight: 200 800;
        font-stretch: 75% 100%;
      }
      @font-face {
        font-family: "Host";
        src: url("public/fonts/host-300_800-normal.woff2") format("woff2");
        font-weight: 300 800;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #fdfcf8;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .ground {
        position: absolute;
        inset: 0;
        background: #fdfcf8;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
      [data-composition-src] {
        position: absolute;
        inset: 0;
      }
      #open { z-index: 2; }
      #pieces { z-index: 3; }
      #captions { z-index: 5; }
      #end { z-index: 6; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="MicroMatchTrailer"
      data-width="1920"
      data-height="1080"
      data-fps="30"
      data-start="0"
      data-duration="45"
    >
      <div class="ground"></div>

      <!-- Footage of the real site, recorded by e2e/capture/footage.mjs and cut by scripts/video/cut-clips.sh. -->
      <video id="entrance" src="public/clips/entrance.mp4" data-start="15.5" data-duration="9" data-track-index="0" muted playsinline></video>
      <video id="unfold" src="public/clips/unfold.mp4" data-start="24.5" data-duration="4.5" data-track-index="0" muted playsinline></video>
      <video id="sewn" src="public/clips/sewn.mp4" data-start="29" data-duration="6" data-track-index="0" muted playsinline></video>
      <video id="languages" src="public/clips/languages.mp4" data-start="35" data-duration="4.5" data-track-index="0" muted playsinline></video>

      <!-- The concept beats, the captions over the footage, and the end card. -->
      <div id="open" data-composition-id="open" data-composition-src="compositions/open.html" data-start="0" data-duration="9.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="pieces" data-composition-id="pieces" data-composition-src="compositions/pieces.html" data-start="9.5" data-duration="6" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="captions" data-track-kind="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="15.5" data-duration="24" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="end" data-composition-id="end" data-composition-src="compositions/end.html" data-start="39.5" data-duration="5.5" data-track-index="4" data-width="1920" data-height="1080"></div>

      <audio id="music" src="public/audio.mp3" data-start="0" data-duration="45" data-track-index="20"></audio>
      <audio id="sfx-sew" src="public/sfx_sew.wav" data-start="29.5" data-duration="0.5" data-track-index="21" data-volume="0.5"></audio>
    </div>
    <script>
      // The bed fades in under the cold open and out over the end card.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#music", { volume: 0 }, { volume: 0.85, duration: 1.2, ease: "none" }, 0)
        .to("#music", { volume: 0, duration: 1.8, ease: "none" }, 43.2);
      window.__timelines.MicroMatchTrailer = tl;
    </script>
  </body>
</html>
