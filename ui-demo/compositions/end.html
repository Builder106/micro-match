<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>End card</title>
  </head>
  <body>
    <template>
      <style>
        /* The title block, stood upright: a sawtooth border around a signed center. */
        #root {
          position: absolute;
          inset: 0;
          background: #f3ead9;
        }
        .border {
          position: absolute;
          inset: 120px 60px;
          background: linear-gradient(135deg, #1c1f3b 50%, #ff6b6b 50%) 0 0 / 60px 60px;
          clip-path: inset(50%);
        }
        .center {
          position: absolute;
          inset: 180px 120px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 0 70px;
          background: #fdfcf8;
          opacity: 0;
        }
        .mark {
          width: 120px;
          height: 120px;
          margin-bottom: 50px;
        }
        h1 {
          margin: 0;
          font: 680 116px/0.95 "Bricolage", sans-serif;
          font-stretch: 96%;
          letter-spacing: -0.035em;
          color: #1c1f3b;
        }
        .note {
          margin: 50px 0 0;
          font: 400 44px/1.3 "Host", sans-serif;
          color: #575b76;
        }
        .url {
          margin: 46px 0 0;
          font: 700 50px/1 "Host", sans-serif;
          color: #1c1f3b;
          text-decoration: underline dashed 4px #ff6b6b;
          text-underline-offset: 12px;
        }
        h1, .note, .url, .mark {
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="end" data-width="1080" data-height="1920">
        <div class="border"></div>
        <div class="center">
          <img class="mark" src="public/mark.svg" alt="" />
          <h1>Small tasks, sewn into something warm.</h1>
          <p class="note">Free and non-commercial. A student project, starting at Wesleyan.</p>
          <p class="url">trymicromatch.com</p>
        </div>
      </div>

      <script>
        // Local time: 0 is 30.71 s in the cut.
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const scope = document.querySelector('[data-composition-id="end"]');
        const $ = (s) => scope.querySelector(s);
        const up = { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" };
        tl.fromTo($(".border"), { clipPath: "inset(50%)" }, { clipPath: "inset(0%)", duration: 0.9, ease: "power3.inOut" }, 0)
          .to($(".center"), { opacity: 1, duration: 0.3, ease: "none" }, 0.55)
          .fromTo($(".mark"), { opacity: 0, y: 18, rotation: -10 }, { ...up, rotation: 0 }, 0.75)
          .fromTo($("h1"), { opacity: 0, y: 22 }, up, 0.95)
          .fromTo($(".note"), { opacity: 0, y: 18 }, up, 1.35)
          .fromTo($(".url"), { opacity: 0, y: 18 }, up, 1.6);
        window.__timelines["end"] = tl;
      </script>
    </template>
  </body>
</html>
