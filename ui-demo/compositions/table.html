<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Table</title>
  </head>
  <body>
    <template>
      <style>
        /* Muslin on the table behind the desktop footage, with the line that says whose side
           of the quilt we are on now. The footage itself sits in the root composition. */
        #root {
          position: absolute;
          inset: 0;
          background:
            repeating-linear-gradient(45deg, rgb(28 31 59 / 0.05) 0 2px, transparent 2px 46px),
            #f3ead9;
        }
        .who {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 300px;
          margin: 0;
          font: 680 92px/1 "Bricolage", sans-serif;
          font-stretch: 96%;
          letter-spacing: -0.03em;
          color: #1c1f3b;
          opacity: 0;
        }
        .who em {
          font-style: normal;
          color: #e0484a;
        }
      </style>

      <div id="root" data-composition-id="table" data-width="1080" data-height="1920">
        <p class="who w-check">A person at the nonprofit <em>checks it.</em></p>
        <p class="who w-sewn">Then it&rsquo;s <em>sewn into the quilt.</em></p>
      </div>

      <script>
        // Local time: 0 is 20.21 s in the cut.
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const scope = document.querySelector('[data-composition-id="table"]');
        const $ = (s) => scope.querySelector(s);
        const settle = { opacity: 1, y: 0, rotation: 0, duration: 0.6, ease: "expo.out" };
        tl.fromTo($(".w-check"), { opacity: 0, y: 24, rotation: -0.8 }, settle, 0.2)
          .to($(".w-check"), { opacity: 0, y: -14, duration: 0.25, ease: "power2.in" }, 5.25)
          .fromTo($(".w-sewn"), { opacity: 0, y: 24, rotation: 0.7 }, settle, 5.6);
        window.__timelines["table"] = tl;
      </script>
    </template>
  </body>
</html>
