<!doctype html>
<html lang="%lang%" dir="%dir%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // A scheme pinned from the quilt label's toggle, applied before paint.
      try {
        document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('mm-color-scheme') ?? 'light dark';
      } catch {}
    </script>
    <meta name="theme-color" content="#fdfcf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14162b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="preload" href="%sveltekit.assets%/fonts/bricolage-200_800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      document.documentElement.classList.add('js', 'motion');
      // The first time the home quilt opens in a session, it is laid out, pinned and quilted.
      try {
        if (/^\/([a-z]{2}\/?)?$/.test(location.pathname) && !matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('mm-entered')) {
          document.documentElement.classList.add('enter');
          sessionStorage.setItem('mm-entered', '1');
        }
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
